services:
  postgres:
    image: postgres:16-alpine
    container_name: chat_postgres_test
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: chatdb
    ports:
      - "7338:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d chatdb"]
      interval: 2s
      timeout: 3s
      retries: 20
